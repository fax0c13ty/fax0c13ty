<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 188" width="900" height="188" role="img" aria-labelledby="title">
  <title id="title">Current engineering focus</title>
  <style>
    .log { animation: appear .5s ease-out both; }
    .build { animation: build 3.8s ease-in-out infinite; }
    .progress { stroke-dasharray: 24 76; animation: progress 3.8s linear infinite; }
    @keyframes build { 50% { opacity: .65; } }
    @keyframes progress { to { stroke-dashoffset: -100; } }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .log, .build, .progress { animation: none; } }
  </style>
  <rect x="1" y="1" width="898" height="186" rx="12" fill="#080809" stroke="#442027"/>
  <path d="M1 49h898" stroke="#442027"/>
  <path d="M680 25h187" stroke="#442027" stroke-width="3" stroke-linecap="round"/>
  <path class="progress" d="M680 25h187" pathLength="100" stroke="#ff304a" stroke-width="3" stroke-linecap="round"/>
  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="21" fill="#e6dadd">
    <text class="build" x="32" y="32" fill="#ff304a">[BUILD OK]</text>
    <text class="log" style="animation-delay:.2s" x="32" y="85"><tspan fill="#ff5364">[arch]</tspan><tspan x="148">Designing fault-tolerant microservices</tspan></text>
    <text class="log" style="animation-delay:.4s" x="32" y="121"><tspan fill="#ff5364">[net]</tspan><tspan x="148">Processing network packets asynchronously</tspan></text>
    <text class="log" style="animation-delay:.6s" x="32" y="157"><tspan fill="#ff5364">[perf]</tspan><tspan x="148">Profiling and optimizing tail latency</tspan></text>
  </g>
</svg>
