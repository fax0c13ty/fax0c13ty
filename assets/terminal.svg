<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="title">
  <title id="title">Linux terminal for fax0c13ty</title>
  <style>
    .line { animation: output .4s ease-out both; }
    .cursor { animation: blink 1.1s 2.2s step-end infinite; }
    @keyframes output { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="898" height="258" rx="15" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 43h898" stroke="#30363d"/>
  <circle cx="24" cy="22" r="4" fill="#58a6ff"/>
  <circle cx="39" cy="22" r="4" fill="#39c5cf"/>
  <circle cx="54" cy="22" r="4" fill="#484f58"/>
  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="19" fill="#c9d1d9">
    <text x="450" y="28" text-anchor="middle" font-size="15" fill="#8b949e">fax0c13ty@linux:~</text>
    <text x="42" y="79"><tspan fill="#39c5cf">$</tspan> neofetch --stdout</text>
    <text class="line" style="animation-delay:.5s" x="42" y="115"><tspan fill="#58a6ff">LANGUAGE</tspan><tspan x="245">C++20 / C++23</tspan></text>
    <text class="line" style="animation-delay:.8s" x="42" y="144"><tspan fill="#58a6ff">NETWORK I/O</tspan><tspan x="245">Linux sockets · epoll · async I/O</tspan></text>
    <text class="line" style="animation-delay:1.1s" x="42" y="173"><tspan fill="#58a6ff">CONCURRENCY</tspan><tspan x="245">Multithreading · thread pools</tspan></text>
    <text class="line" style="animation-delay:1.4s" x="42" y="202"><tspan fill="#58a6ff">SYSTEMS</tspan><tspan x="245">High-load, low-latency services</tspan></text>
    <g class="line" style="animation-delay:1.8s">
      <text x="42" y="234" fill="#39c5cf">$</text>
      <rect class="cursor" x="65" y="218" width="10" height="19" rx="1" fill="#39c5cf"/>
    </g>
  </g>
</svg>
