<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" role="img" aria-labelledby="title">
  <title id="title">Animated Anonymous mask</title>
  <style>
    .mask { animation: float 5s ease-in-out infinite; }
    .halo { animation: breathe 4s ease-in-out infinite; }
    .orbit { transform-origin: 450px 131px; animation: rotate 16s linear infinite; }
    .scan { animation: scan 4.8s linear infinite; }
    .trace { stroke-dasharray: 11 89; animation: flow 3.6s linear infinite; }
    @keyframes float { 50% { transform: translateY(-5px); } }
    @keyframes breathe { 50% { opacity: .42; } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes scan { from { transform: translateY(-180px); } to { transform: translateY(180px); } }
    @keyframes flow { to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) {
      .mask, .halo, .orbit, .trace { animation: none; }
      .scan { animation: none; display: none; }
    }
  </style>
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#9c1c33" stop-opacity=".48"/>
      <stop offset="1" stop-color="#080809" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x2="1" y2="1">
      <stop stop-color="#54212b"/>
      <stop offset=".5" stop-color="#231115"/>
      <stop offset="1" stop-color="#0e090b"/>
    </linearGradient>
    <path id="silhouette" d="M450 44c-36 0-63 17-69 52-9 48 13 90 41 112 10 8 20 13 28 14 8-1 18-6 28-14 28-22 50-64 41-112-6-35-33-52-69-52Z"/>
    <clipPath id="face-clip">
      <use href="#silhouette"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="898" height="260" rx="15" fill="#080809" stroke="#442027"/>
  <ellipse class="halo" cx="450" cy="131" rx="244" ry="124" fill="url(#glow)"/>
  <circle cx="450" cy="131" r="110" fill="none" stroke="#442027"/>
  <circle class="orbit" cx="450" cy="131" r="110" pathLength="100" fill="none" stroke="#ff5364" stroke-dasharray="8 42" stroke-width="2"/>
  <path d="M32 131h124l27-30h109M868 131H744l-27 30H608" fill="none" stroke="#442027"/>
  <path class="trace" d="M32 131h124l27-30h109M608 161h109l27-30h124" pathLength="100" fill="none" stroke="#ff304a" stroke-width="2"/>
  <g class="mask">
    <use href="#silhouette" fill="url(#face)" stroke="#ff5364" stroke-width="2"/>
    <path d="M391 91q21-21 48 1m70-1q-21-21-48 1" fill="none" stroke="#ff5364" stroke-width="5" stroke-linecap="round"/>
    <path d="M391 111q23-24 48 2-25 12-48-2Zm118 0q-23-24-48 2 25 12 48-2Z" fill="#080809" stroke="#af4354"/>
    <path class="halo" d="M402 111q13-9 26 0m44 0q13-9 26 0" fill="none" stroke="#ff7484" stroke-width="2"/>
    <path d="m450 102-9 37 9 5 9-5m-46 33q37 17 74 0m-43 14q6 6 12 0" fill="none" stroke="#ff7484" stroke-width="2" stroke-linecap="round"/>
    <path d="M450 151c-14-14-30 14-47 2 10 18 34 11 47 3 13 8 37 15 47-3-17 12-33-16-47-2Zm-6 41 6 18 6-18c-4 2-8 2-12 0Z" fill="#080809" stroke="#af4354"/>
    <g clip-path="url(#face-clip)">
      <rect class="scan" x="375" y="125" width="150" height="14" fill="#ff5364" opacity=".26"/>
    </g>
  </g>
</svg>
