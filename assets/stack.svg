<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="title">
  <title id="title">Systems programming stack</title>
  <style>
    .tile { animation: reveal .55s ease-out both; }
    .edge { stroke-dasharray: 20 80; animation: sweep 4s linear infinite; }
    @keyframes sweep { to { stroke-dashoffset: -100; } }
    @keyframes reveal { from { opacity: .25; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .tile, .edge { animation: none; } }
  </style>
  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="19" fill="#e6dadd">
    <g class="tile">
      <rect x="1" y="1" width="440" height="132" rx="12" fill="#080809" stroke="#442027"/>
      <text x="24" y="37" fill="#ff5364">[ languages ]</text>
      <text x="24" y="76">Modern C++17 / C++20 / C++23</text>
      <text x="24" y="105">C · Python · SQL · Bash</text>
      <path d="M24 121h394" stroke="#32151c"/>
      <path class="edge" d="M24 121h394" pathLength="100" stroke="#ff304a" style="animation-delay:0s"/>
    </g>
    <g class="tile" style="animation-delay:.12s">
      <rect x="459" y="1" width="440" height="132" rx="12" fill="#080809" stroke="#442027"/>
      <text x="482" y="37" fill="#ff304a">[ backend &amp; networking ]</text>
      <text x="482" y="76">Boost.Asio · gRPC · REST API</text>
      <text x="482" y="105">WebSockets · Linux epoll / sockets</text>
      <path d="M482 121h394" stroke="#32151c"/>
      <path class="edge" d="M482 121h394" pathLength="100" stroke="#ff304a" style="animation-delay:-1s"/>
    </g>
    <g class="tile" style="animation-delay:.24s">
      <rect x="1" y="147" width="440" height="132" rx="12" fill="#080809" stroke="#442027"/>
      <text x="24" y="183" fill="#ff304a">[ databases &amp; brokers ]</text>
      <text x="24" y="222">PostgreSQL · Redis · Kafka</text>
      <path d="M24 267h394" stroke="#32151c"/>
      <path class="edge" d="M24 267h394" pathLength="100" stroke="#ff304a" style="animation-delay:-2s"/>
    </g>
    <g class="tile" style="animation-delay:.36s">
      <rect x="459" y="147" width="440" height="132" rx="12" fill="#080809" stroke="#442027"/>
      <text x="482" y="183" fill="#ff5364">[ toolchain ]</text>
      <text x="482" y="222">CMake · GCC / Clang · Docker</text>
      <text x="482" y="251">Git · GDB / Valgrind</text>
      <path d="M482 267h394" stroke="#32151c"/>
      <path class="edge" d="M482 267h394" pathLength="100" stroke="#ff304a" style="animation-delay:-3s"/>
    </g>
  </g>
</svg>
